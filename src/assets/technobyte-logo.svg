<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Vibrant Gradient from Technobyte Innovations official logo -->
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Outer Soft Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#00D2FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hexagon Outer Badge Background with Gradient -->
  <path 
    d="M 45.5 9.5 
       Q 50 7 54.5 9.5 
       L 85.5 27.4 
       Q 89 29.4 89 33.4 
       L 89 66.6 
       Q 89 70.6 85.5 72.6 
       L 54.5 90.5 
       Q 50 93 45.5 90.5 
       L 14.5 72.6 
       Q 11 70.6 11 66.6 
       L 11 33.4 
       Q 11 29.4 14.5 27.4 
       Z" 
    fill="url(#tbGrad)" 
    filter="url(#badgeGlow)"
  />

  <!-- Hexagon Inner Crisp White Border -->
  <path 
    d="M 46.5 15.5 
       Q 50 13.5 53.5 15.5 
       L 81.5 31.7 
       Q 84.5 33.4 84.5 36.9 
       L 84.5 63.1 
       Q 84.5 66.6 81.5 68.3 
       L 53.5 84.5 
       Q 50 86.5 46.5 84.5 
       L 18.5 68.3 
       Q 15.5 66.6 15.5 63.1 
       L 15.5 36.9 
       Q 15.5 33.4 18.5 31.7 
       Z" 
    stroke="#FFFFFF" 
    stroke-width="5" 
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <!-- TB Monogram (Crisp White) -->
  <!-- Stylized 'T' with diagonal bevel at top-right -->
  <path 
    d="M 23 34
       L 46 34
       L 39 42
       L 37 42
       L 37 66
       L 29.5 66
       L 29.5 42
       L 23 42
       Z" 
    fill="#FFFFFF" 
  />

  <!-- Stylized 'B' with matching diagonal cut and rounded loops -->
  <path 
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 42.5 42.5
       L 50 34
       L 64.5 34
       C 70.5 34, 75 36.8, 75 41.5
       C 75 45.2, 72.2 47.8, 68 49.2
       C 73.2 50.5, 76.5 53.6, 76.5 58.5
       C 76.5 63.8, 71.5 66, 64.5 66
       L 42.5 66
       Z
       M 50.5 40
       L 50.5 47
       L 63 47
       C 66 47, 67.5 45.5, 67.5 43.5
       C 67.5 41.5, 66 40, 63 40
       Z
       M 50.5 53
       L 50.5 60
       L 63.5 60
       C 66.8 60, 68.5 58.5, 68.5 56.5
       C 68.5 54.5, 66.8 53, 63.5 53
       Z" 
    fill="#FFFFFF" 
  />
</svg>